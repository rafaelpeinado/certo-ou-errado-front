<div class="container py-3">
  <div class="mb-3 text-center">
    <h1 class="h3 m-0">COÉ</h1>
    <p class="text-muted mb-0">Certo ou Errado</p>
    <small *ngIf="gameId">O seu ID é: {{ gameId }}</small>
  </div>

  <div class="d-grid gap-2 mb-3">
    <button class="btn btn-success" (click)="navigate(routes.QUESTION)" [disabled]="alreadyPlayed">Iniciar Jogo</button>
    <button class="btn btn-outline-primary" (click)="navigate(routes.RANKING)">Ranking</button>
    <button class="btn btn-outline-danger" (click)="logout()">Sair</button>
  </div>
</div>
