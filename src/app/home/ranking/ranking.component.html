<div class="container d-flex flex-column vh-100 py-3">
  <!-- Topo -->
  <div class="pb-2 position-sticky top-0 bg-white">
    <h2 class="text-center fw-bold m-0">🏆 Ranking</h2>
  </div>

  <!-- Meio rolável -->
  <div class="flex-grow-1 overflow-auto my-3" style="min-height: 0;" *ngIf="rankings.length > 0">
    <div *ngFor="let r of rankings; let i = index" class="card mb-2 shadow-sm border-0 rounded-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h5 class="fw-bold mb-1">
            <span [ngClass]="getMedalClass(i)">{{ i + 1 }}</span>
            {{ r.name }}
          </h5>
          <small class="text-muted d-block">Tempo: {{ r.timeMs | timeFormat }}</small>
          <small class="text-muted d-block">ID: {{ r.gameId }}</small>
          <small class="text-muted d-block" *ngIf="r.class">Turma: {{ r.class }}</small>
        </div>
        <span class="fw-bold text-primary fs-5">{{ r.score }}</span>
      </div>
    </div>
  </div>
  <div *ngIf="rankings.length === 0">
    Ainda não há dados para serem exibidos.
  </div>

  <!-- Rodapé fixo dentro da viewport -->
  <div class="pt-2 position-sticky bottom-0 bg-white">
    <button class="btn btn-outline-secondary w-100" [routerLink]="appRoutes.HOME">Voltar</button>
  </div>
</div>
